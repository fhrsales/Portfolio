				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-300.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Fira Sans';

				src: url('%sveltekit.assets%/fonts/FiraSans-400.woff2') format('woff2');

				src: url('%sveltekit.assets%/fonts/FiraSans-500.woff2') format('woff2');

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

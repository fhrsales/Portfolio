<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="index, follow" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Fabio Sales" />
		<meta property="og:image" content="https://fhrsales.github.io/Portfolio/imgs/share-2026.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Fabio Sales, design leader and product builder" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:image"
			content="https://fhrsales.github.io/Portfolio/imgs/share-2026.jpg"
		/>
		<meta name="author" content="Fabio Sales" />
		<meta name="theme-color" content="#ffffff" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- the title and body fonts arrive with the page, so text does not reflow when they swap in -->
		<link rel="preload" href="%sveltekit.assets%/fonts/Newsreader-400-600.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/FiraSans-400.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			/* Fonts are served from the site itself: no extra connections before the first text paints. */
			@font-face {
				font-family: 'Fira Sans';
				font-style: normal;
				font-weight: 300;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-300.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Fira Sans';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-400.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Fira Sans';
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-500.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Fira Sans';
				font-style: normal;
				font-weight: 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-600.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Fira Sans';
				font-style: normal;
				font-weight: 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/FiraSans-700.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Newsreader';
				font-style: normal;
				font-weight: 400 600;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/Newsreader-400-600.woff2') format('woff2');
			}
		</style>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<!-- Google Analytics, with consent mode: no cookies until the visitor accepts the notice.
		     The library itself loads after the page, so it never delays the first paint. -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			var consent = null;
			try { consent = localStorage.getItem('analytics-consent'); } catch (e) {}
			gtag('consent', 'default', {
				analytics_storage: consent === 'granted' ? 'granted' : 'denied',
				ad_storage: 'denied',
				ad_user_data: 'denied',
				ad_personalization: 'denied'
			});
			gtag('js', new Date());
			gtag('config', 'G-Q9D6B0JQFR');
			if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
				var loadGtag = function () {
					var s = document.createElement('script');
					s.async = true;
					s.src = 'https://www.googletagmanager.com/gtag/js?id=G-Q9D6B0JQFR';
					document.head.appendChild(s);
				};
				if (document.readyState === 'complete') setTimeout(loadGtag, 1500);
				else addEventListener('load', function () { setTimeout(loadGtag, 1500); });
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

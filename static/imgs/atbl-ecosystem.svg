<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">ATBL digital ecosystem</title><desc id="desc">Customer, B2B portal, ERP, billing and delivery connected as one product system.</desc><style>.bg{fill:#f7f7f5}.ey{font:600 24px Arial,sans-serif;fill:#666}.t{font:700 36px Arial,sans-serif;fill:#171717}.s{font:400 22px Arial,sans-serif;fill:#555}.box{fill:white;stroke:#d7d7d2;stroke-width:2}.line{stroke:#222;stroke-width:3;fill:none}.dot{fill:#222}</style><rect class="bg" width="1600" height="620" rx="28"/><text class="ey" x="90" y="82">PRODUCT SYSTEM</text><text class="t" x="90" y="132">Complexity stays behind the experience</text><text class="s" x="90" y="172">One flow connects the buyer to operational truth without exposing ERP structure.</text><path class="line" d="M250 355 H1350"/><circle class="dot" cx="250" cy="355" r="8"/><circle class="dot" cx="525" cy="355" r="8"/><circle class="dot" cx="800" cy="355" r="8"/><circle class="dot" cx="1075" cy="355" r="8"/><circle class="dot" cx="1350" cy="355" r="8"/><g><rect class="box" x="125" y="245" width="250" height="180" rx="18"/><text class="t" x="250" y="315" text-anchor="middle">Customer</text><text class="s" x="250" y="355" text-anchor="middle">technical need</text><text class="s" x="250" y="388" text-anchor="middle">commercial context</text></g><g><rect class="box" x="400" y="225" width="250" height="220" rx="18"/><text class="t" x="525" y="300" text-anchor="middle">B2B Portal</text><text class="s" x="525" y="342" text-anchor="middle">catalog · stock</text><text class="s" x="525" y="375" text-anchor="middle">price · documents</text><text class="s" x="525" y="408" text-anchor="middle">self-service</text></g><g><rect class="box" x="675" y="225" width="250" height="220" rx="18"/><text class="t" x="800" y="300" text-anchor="middle">ERP</text><text class="s" x="800" y="342" text-anchor="middle">inventory · tax</text><text class="s" x="800" y="375" text-anchor="middle">customer rules</text><text class="s" x="800" y="408" text-anchor="middle">order state</text></g><g><rect class="box" x="950" y="245" width="250" height="180" rx="18"/><text class="t" x="1075" y="315" text-anchor="middle">Billing</text><text class="s" x="1075" y="355" text-anchor="middle">approved order</text><text class="s" x="1075" y="388" text-anchor="middle">without re-entry</text></g><g><rect class="box" x="1225" y="245" width="250" height="180" rx="18"/><text class="t" x="1350" y="315" text-anchor="middle">Delivery</text><text class="s" x="1350" y="355" text-anchor="middle">status returns</text><text class="s" x="1350" y="388" text-anchor="middle">to the experience</text></g><text class="s" x="800" y="535" text-anchor="middle">Design principle: expose the information needed for a decision — absorb the operational complexity underneath.</text></svg>